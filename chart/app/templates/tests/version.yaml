apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-version
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: version
      image: {{ .Values.test.image }}
      command:
        - sh
        - -c
        - wget -qO- http://{{ .Release.Name }}:{{ .Values.service.port }}/version | grep -q '"{{ .Values.image.tag }}"'
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
